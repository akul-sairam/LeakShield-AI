<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>LeakShield AI</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>LeakShield AI</h1>
            <div class="status">
                <span>Shield:</span>
                <span class="status-on" id="status-text">Active</span>
            </div>
        </header>

        <section class="section">
            <div class="setting">
                <div class="setting-header">
                    <label for="sensitivity">AI Sensitivity</label>
                    <span id="sensitivity-value">75%</span>
                </div>
                <input type="range" id="sensitivity" min="1" max="100" value="75">
            </div>
        </section>

        <section class="section">
            <h2>Protection Categories</h2>
            <div class="toggles-grid">
                <div class="toggle-item">
                    <span>Email Addresses</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-email" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-item">
                    <span>Phone Numbers</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-phone" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-item">
                    <span>API Keys & Auth Tokens</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-api" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-item">
                    <span>Credit Cards</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-card" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-item">
                    <span>IP Addresses</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-ip" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-item">
                    <span>Company Secrets</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-secrets" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </section>

        <section class="section">
            <h2>Custom Keywords</h2>
            <div class="keyword-input-group">
                <input type="text" id="keyword-input" placeholder="Add custom keyword..." autocomplete="off">
                <button id="add-keyword-btn">+</button>
            </div>
            <ul id="keyword-list" class="keyword-list">
                <!-- Dynamically populated -->
            </ul>
        </section>

        <footer>
            <button id="view-logs">View Blocked Leaks</button>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>

</html>
